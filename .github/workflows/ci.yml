name: CI

on:
  pull_request:
    branches: [main]

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      application: ${{ steps.filter.outputs.application }}
      admin: ${{ steps.filter.outputs.admin }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/ci.yml'
            application:
              - 'application/**'
              - '.prettierrc'
              - '.github/workflows/ci.yml'
            admin:
              - 'admin/**'
              - '.prettierrc'
              - '.github/workflows/ci.yml'
            web:
              - 'web/**'
              - '.prettierrc'
              - '.github/workflows/ci.yml'

  backend-ci:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: prolog_test
          MYSQL_USER: prolog
          MYSQL_PASSWORD: prolog
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v4

      - name: Build & test
        working-directory: backend
        env:
          SPRING_PROFILES_ACTIVE: test
          JWT_SECRET: ci-test-secret-key-for-hmac-sha256-minimum-32-chars
          JWT_ACCESS_EXP: 3600000
          JWT_REFRESH_EXP: 604800000
        run: ./gradlew build

  application-ci:
    needs: changes
    if: needs.changes.outputs.application == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: application/package-lock.json

      - name: Install dependencies
        working-directory: application
        run: npm ci

      - name: Type check
        working-directory: application
        run: node_modules/.bin/tsc --noEmit

      - name: Prettier check
        working-directory: application
        run: npx prettier --check .

  admin-ci:
    needs: changes
    if: needs.changes.outputs.admin == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: admin/package-lock.json

      - name: Install dependencies
        working-directory: admin
        run: npm ci

      - name: Type check
        working-directory: admin
        run: node_modules/.bin/tsc --noEmit

      - name: Prettier check
        working-directory: admin
        run: npx prettier --check .

  web-ci:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Type check
        working-directory: web
        run: node_modules/.bin/tsc --noEmit

      - name: Prettier check
        working-directory: web
        run: npx prettier --check .

  ci-success:
    needs: [backend-ci, application-ci, admin-ci, web-ci]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: All jobs passed or were skipped
        run: |
          echo "backend-ci:     ${{ needs.backend-ci.result }}"
          echo "application-ci: ${{ needs.application-ci.result }}"
          echo "admin-ci:       ${{ needs.admin-ci.result }}"
          echo "web-ci:         ${{ needs.web-ci.result }}"

          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" || \
                "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "One or more jobs failed or were cancelled."
            exit 1
          fi

          echo "All jobs succeeded or were skipped."